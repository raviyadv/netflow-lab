# Connector JARs mounted into every Flink container
x-flink-jars: &flink-jars
  - ./flink-lib/flink-sql-connector-kafka.jar:/opt/flink/lib/flink-sql-connector-kafka.jar
  - ./flink-lib/flink-connector-jdbc.jar:/opt/flink/lib/flink-connector-jdbc.jar
  - ./flink-lib/postgresql.jar:/opt/flink/lib/postgresql.jar

services:
  # ---------- Kafka (single broker, KRaft mode = no ZooKeeper) ----------
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL = other containers, EXTERNAL = the Lambda in the VPC
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${PRIVATE_IP}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Creates the topic once Kafka is healthy, then exits
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:29092
      - --create
      - --if-not-exists
      - --topic
      - network-events
      - --partitions
      - "3"
      - --replication-factor
      - "1"

  # ---------- Flink ----------
  jobmanager:
    image: flink:1.19
    container_name: jobmanager
    restart: unless-stopped
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1024m
        parallelism.default: 1
    volumes: *flink-jars

  taskmanager:
    image: flink:1.19
    container_name: taskmanager
    restart: unless-stopped
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 2048m
    volumes: *flink-jars

  # ---------- Postgres: Flink writes anomalies here ----------
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: netmon
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: grafana   # lab only
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # ---------- Grafana: dashboards ----------
  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123   # lab only
    depends_on:
      - postgres
